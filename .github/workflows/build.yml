name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add widget and icon
        run: |
          cp -r native/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/java/com/matthew/osakacountdown
          cp native/CountdownWidget.java android/app/src/main/java/com/matthew/osakacountdown/
          python3 native/patch_manifest.py
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: osaka-countdown-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
